<!-- 分類按鈕 -->
    <div class="module-bar">
      <button class="mod-pill" id="mod-p1315" onclick="setModule('p1315')">📘 P.13-15 (圖表/比例)</button>
      <button class="mod-pill" id="mod-p20" onclick="setModule('p20')">📙 P.20 (寫作範文詞)</button>
      <button class="mod-pill active" id="mod-pathway" onclick="setModule('pathway')">📗 Pathway 4 (重點詞彙)</button>
    </div>

    <!-- 首頁總覽看板 -->
    <div id="view-dashboard">
      <div class="stat-cards">
        <div class="stat-card c-mastered">
          <span class="stat-num" id="count-mastered">0</span>
          <span class="stat-label">完全熟悉 (連對 3 次+)</span>
        </div>
        <div class="stat-card c-familiar">
          <span class="stat-num" id="count-familiar">0</span>
          <span class="stat-label">未算太熟悉 (連對 1~2 次)</span>
        </div>
        <div class="stat-card c-unfamiliar">
          <span class="stat-num" id="count-unfamiliar">0</span>
          <span class="stat-label">完全不熟悉 (待鞏固)</span>
        </div>
      </div>

      <div class="category-group">
        <div class="category-title" style="color: var(--unfamiliar);">
          <span>🔴 完全不熟悉 / 待重溫</span>
          <span class="tag-count" style="background: var(--unfamiliar);" id="badge-unfamiliar">0</span>
        </div>
        <div class="vocab-list" id="list-unfamiliar"></div>
      </div>

      <div class="category-group">
        <div class="category-title" style="color: var(--familiar);">
          <span>🟡 未算太熟悉 / 掌握中</span>
          <span class="tag-count" style="background: var(--familiar);" id="badge-familiar">0</span>
        </div>
        <div class="vocab-list" id="list-familiar"></div>
      </div>

      <div class="category-group">
        <div class="category-title" style="color: var(--mastered);">
          <span>🟢 完全熟悉</span>
          <span class="tag-count" style="background: var(--mastered);" id="badge-mastered">0</span>
        </div>
        <div class="vocab-list" id="list-mastered"></div>
      </div>

      <div style="text-align: center; margin-top: 30px;">
        <button class="btn-reset" onclick="resetAllProgress()">重設當前分類答題紀錄</button>
      </div>
    </div>

    <!-- 配對測驗頁面 -->
    <div id="view-quiz" style="display: none;">
      <div class="quiz-status">
        <span id="quiz-mod-title">當前分區</span>
        <span id="quiz-progress">0 / 6</span>
      </div>

      <div class="grid">
        <div class="col" id="col-left"></div>
        <div class="col" id="col-right"></div>
      </div>

      <div class="quiz-footer">
        <div id="quiz-feedback" style="min-height: 24px; font-weight: 700; color: var(--mastered);"></div>
        <button class="btn-action" onclick="startQuizRound()">換下一組挑戰 (6題)</button>
      </div>
    </div>
  </div>

  <script>
    const database = {
      // 模組一：P.13 - 15 (圖表趨勢、比例與介詞)
      p1315: [
        { id: 101, left: "Sharply", right: "急劇地" },
        { id: 102, left: "rapidly", right: "迅速地" },
        { id: 103, left: "steeply", right: "陡峭地" },

        { id: 124, left: "=25%", right: "roughly one quarter" },
        { id: 125, left: "~33%", right: "almost/nearly one-third" },
        { id: 126, left: "~50%", right: "around a half" },
        { id: 127, left: "51%", right: "just over a half" },
        { id: 128, left: "<=75%", right: "nearly/almost three quarters" },
        { id: 129, left: "<2%", right: "a tiny portion" },
        { id: 130, left: "<5%", right: "an insignificant minority" },
        { id: 131, left: "<15%", right: "a small minority" },
        { id: 132, left: ">50%", right: "the majority" },
        { id: 133, left: "70%", right: "a large proportion" },
        { id: 134, left: "75%", right: "a significant majority" },
        { id: 135, left: "90%", right: "a very large proportion" },
        { id: 136, left: "gap", right: "a large gap between ... and ..." },
        { id: 137, left: "at", right: "指出精確數值或頂點 (peak at)" },
        { id: 138, left: "to", right: "指出趨勢最終到達點 (rose to)" },
        { id: 139, left: "by", right: "指出增減的差額幅度 (rose by)" },
        { id: 140, left: "from ... to ...", right: "指出起點與終點" },
        { id: 141, left: "of", right: "名詞後直接接數值 (a high of)" }
      ],

      // 模組二：P.20 (科技與職場就業·實戰高分詞組)
      p20: [
        { id: 201, left: "technological breakthroughs", right: "技術突破" },
        { id: 202, left: "dire shortage of jobs", right: "極度缺乏職位" },
        { id: 203, left: "sophisticated machines", right: "精密/複雜的機器" },
        { id: 204, left: "assembly-line automation", right: "流水線自動化" },
        { id: 205, left: "excel at", right: "擅長於..." },
        { id: 206, left: "repetitive tasks", right: "重複性任務" },
        { id: 207, left: "taking inventory", right: "盤點庫存" },
        { id: 208, left: "collaborative ecosystem", right: "人機協同生態系統" },
        { id: 209, left: "optimizing operational efficiency", right: "優化營運效率" },
        { id: 210, left: "inevitable fact", right: "不可避免的事實" },
        { id: 211, left: "tactile feedback", right: "觸覺反饋 / 手感" },
        { id: 212, left: "delicate assignments", right: "精細/細緻的任務" },
        { id: 213, left: "common sense", right: "常識 / 應變判斷" },
        { id: 214, left: "wipe out the workforce", right: "徹底取代/消滅勞動力" },
        { id: 215, left: "human input", right: "人類的投入與參與" },
        { id: 216, left: "adapt and evolve", right: "適應並進化" },
        { id: 217, left: "lacks the capacity for", right: "缺乏...的能力" },
        { id: 218, left: "providing the impetus", right: "提供推動力/動機" }
      ],

      // 模組三：Pathway 4 Unit 1 課文重點 Highlight 詞彙（精確提取）
      pathway: [
        // 相片一 (p.7) 標註單詞
        { id: 301, left: "coined", right: "創造(新詞語)" },
        { id: 302, left: "set the template", right: "樹立典範 / 定下範本" },
        { id: 303, left: "curtain falls", right: "落幕 / 結束" },
        { id: 304, left: "imaginary", right: "想像的 / 虛構的" },
        { id: 305, left: "droids", right: "機器人 (如星戰)" },
        { id: 306, left: "turbines", right: "渦輪機" },
        { id: 307, left: "horizon", right: "地平線" },
        { id: 308, left: "three-armed", right: "三臂的" },
        { id: 309, left: "foundation", right: "地基 / 基礎" },
        { id: 310, left: "excavator", right: "挖掘機 / 鏟泥車" },
        { id: 311, left: "operator", right: "操作員" },
        { id: 312, left: "gyroscope", right: "陀螺儀" },
        { id: 313, left: "co-founder", right: "共同創辦人" },
        { id: 314, left: "circuit", right: "電路" },
        { id: 315, left: "wires", right: "導線 / 電線" },
        { id: 316, left: "commands", right: "指令 / 命令" },
        { id: 317, left: "joysticks", right: "操作桿 / 搖桿" },
        { id: 318, left: "pedals", right: "踏板" },

        // 相片二 (p.8-9) 標註單詞
        { id: 319, left: "encounter", right: "偶遇 / 遇到" },
        { id: 320, left: "industrial", right: "工業的" },
        { id: 321, left: "fenced", right: "被圍住 / 隔開的" },
        { id: 322, left: "accelerating", right: "加速" },
        { id: 323, left: "sturdier", right: "更堅固結實的" },
        { id: 324, left: "beehive", right: "蜂巢" },
        { id: 325, left: "fetch", right: "取來 / 拿來" },
        { id: 326, left: "mailing", right: "郵寄" },
        { id: 327, left: "autistic", right: "自閉症的" },
        { id: 328, left: "disinfect", right: "消毒" },
        { id: 329, left: "zeitgeist", right: "時代精神 / 時代思潮" },
        { id: 330, left: "insurance", right: "保險" },
        { id: 331, left: "incentives", right: "誘因 / 獎勵機制" },
        { id: 332, left: "executives", right: "管理高層 / 執行官" },

        // 相片三 (p.10) 標註單詞
        { id: 333, left: "plenty", right: "大量 / 充足" },
        { id: 334, left: "bulldozer", right: "推土機" },
        { id: 335, left: "ramps", right: "斜坡 / 坡道" },
        { id: 336, left: "harvest lettuce", right: "採收生菜 / 萵苣" },
        { id: 337, left: "manufacturing", right: "製造業 / 生產" },
        { id: 338, left: "tournament", right: "錦標賽 / 聯賽" },
        { id: 339, left: "spur", right: "促進 / 激勵" },
        { id: 340, left: "continents", right: "大洲 / 大陸" },
        { id: 341, left: "bipedal", right: "雙足行走的" },
        { id: 342, left: "maximize", right: "使最大化" },
        { id: 343, left: "relate to", right: "理解 / 與...產生共鳴" },
        { id: 344, left: "master", right: "精通 / 掌握" }
      ]
    };

    let currentModule = 'pathway'; // 預設打開 Pathway 4 方便即刻溫習
    let currentView = 'dashboard';
    let stats = JSON.parse(localStorage.getItem('vocab_stats_multimod_v3') || '{}');

    function saveStats() {
      localStorage.setItem('vocab_stats_multimod_v3', JSON.stringify(stats));
    }

    function setModule(mod) {
      currentModule = mod;
      ['p1315', 'p20', 'pathway'].forEach(m => {
        document.getElementById(`mod-${m}`).className = 'mod-pill' + (m === mod ? ' active' : '');
      });
      if (currentView === 'dashboard') {
        renderDashboard();
      } else {
        startQuizRound();
      }
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('view-dashboard').style.display = view === 'dashboard' ? 'block' : 'none';
      document.getElementById('view-quiz').style.display = view === 'quiz' ? 'block' : 'none';
      document.getElementById('nav-dashboard').className = 'nav-btn' + (view === 'dashboard' ? ' active' : '');
      document.getElementById('nav-quiz').className = 'nav-btn' + (view === 'quiz' ? ' active' : '');

      if (view === 'dashboard') renderDashboard();
      else startQuizRound();
    }

    function getLevel(id) {
      const rec = stats[id];
      if (!rec || !rec.streak || rec.streak <= 0) return "unfamiliar";
      if (rec.streak >= 3) return "mastered";
      return "familiar";
    }

    function renderDashboard() {
      const curData = database[currentModule];
      const groups = { mastered: [], familiar: [], unfamiliar: [] };

      curData.forEach(item => {
        const lvl = getLevel(item.id);
        groups[lvl].push(item);
      });

      document.getElementById('count-mastered').textContent = groups.mastered.length;
      document.getElementById('count-familiar').textContent = groups.familiar.length;
      document.getElementById('count-unfamiliar').textContent = groups.unfamiliar.length;

      document.getElementById('badge-mastered').textContent = groups.mastered.length;
      document.getElementById('badge-familiar').textContent = groups.familiar.length;
      document.getElementById('badge-unfamiliar').textContent = groups.unfamiliar.length;

      ['mastered', 'familiar', 'unfamiliar'].forEach(lvl => {
        const container = document.getElementById(`list-${lvl}`);
        if (groups[lvl].length === 0) {
          container.innerHTML = '<div style="color:#94a3b8; font-size:0.85rem; padding:8px 0;">暫無此等級項目</div>';
        } else {
          container.innerHTML = groups[lvl].map(item => {
            const streak = (stats[item.id] && stats[item.id].streak) || 0;
            return `
              <div class="vocab-row">
                <div class="vocab-left">
                  <span class="vocab-en">${item.left}</span>
                  <span class="streak-badge">連對 ${streak} 次</span>
                </div>
                <span class="vocab-target">${item.right}</span>
              </div>
            `;
          }).join('');
        }
      });
    }

    let selLeft = null, selRight = null;
    let currentRoundMatched = 0;
    const ROUND_SIZE = 6;

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function startQuizRound() {
      const lBox = document.getElementById('col-left');
      const rBox = document.getElementById('col-right');
      const fb = document.getElementById('quiz-feedback');
      const curData = database[currentModule];

      const modNames = { p1315: '📘 P.13-15', p20: '📙 P.20 寫作詞組', pathway: '📗 Pathway 4 重點詞' };
      document.getElementById('quiz-mod-title').textContent = `${modNames[currentModule]} 配對`;

      lBox.innerHTML = ''; rBox.innerHTML = '';
      fb.textContent = '';
      selLeft = null; selRight = null;
      currentRoundMatched = 0;
      updateQuizProgress();

      const unfamiliarList = curData.filter(d => getLevel(d.id) === 'unfamiliar');
      const familiarList = curData.filter(d => getLevel(d.id) === 'familiar');
      const masteredList = curData.filter(d => getLevel(d.id) === 'mastered');

      let pool = shuffle(unfamiliarList).concat(shuffle(familiarList)).concat(shuffle(masteredList));
      let roundItems = pool.slice(0, Math.min(ROUND_SIZE, curData.length));

      let shuffledL = shuffle(roundItems);
      let shuffledR = shuffle(roundItems);

      shuffledL.forEach(item => {
        let btn = document.createElement('button');
        btn.className = 'card-btn';
        btn.textContent = item.left;
        btn.dataset.id = item.id;
        btn.onclick = () => {
          if (btn.classList.contains('matched')) return;
          if (selLeft) selLeft.classList.remove('selected');
          selLeft = btn;
          btn.classList.add('selected');
          checkAnswer();
        };
        lBox.appendChild(btn);
      });

      shuffledR.forEach(item => {
        let btn = document.createElement('button');
        btn.className = 'card-btn';
        btn.textContent = item.right;
        btn.dataset.id = item.id;
        btn.onclick = () => {
          if (btn.classList.contains('matched')) return;
          if (selRight) selRight.classList.remove('selected');
          selRight = btn;
          btn.classList.add('selected');
          checkAnswer();
        };
        rBox.appendChild(btn);
      });
    }

    function recordResult(id, isCorrect) {
      if (!stats[id]) stats[id] = { streak: 0 };
      if (isCorrect) {
        stats[id].streak = (stats[id].streak || 0) + 1;
      } else {
        stats[id].streak = 0;
      }
      saveStats();
    }

    function checkAnswer() {
      if (!selLeft || !selRight) return;

      const isMatch = selLeft.dataset.id === selRight.dataset.id;
      const id = selLeft.dataset.id;
      const curData = database[currentModule];
      const maxInRound = Math.min(ROUND_SIZE, curData.length);

      if (isMatch) {
        recordResult(id, true);
        selLeft.className = 'card-btn matched';
        selRight.className = 'card-btn matched';
        selLeft = null; selRight = null;
        currentRoundMatched++;
        updateQuizProgress();

        if (currentRoundMatched === maxInRound) {
          document.getElementById('quiz-feedback').textContent = '✨ 完美！本組單詞全部配對成功！';
        }
      } else {
        recordResult(selLeft.dataset.id, false);
        recordResult(selRight.dataset.id, false);

        let l = selLeft, r = selRight;
        l.classList.add('error');
        r.classList.add('error');

        setTimeout(() => {
          l.classList.remove('error', 'selected');
          r.classList.remove('error', 'selected');
        }, 380);

        selLeft = null; selRight = null;
      }
    }

    function updateQuizProgress() {
      const curData = database[currentModule];
      const maxInRound = Math.min(ROUND_SIZE, curData.length);
      document.getElementById('quiz-progress').textContent = `${currentRoundMatched} / ${maxInRound}`;
    }

    function resetAllProgress() {
      if (confirm(`確定要清空當前【${currentModule}】分類的記憶紀錄嗎？`)) {
        database[currentModule].forEach(item => {
          delete stats[item.id];
        });
        saveStats();
        renderDashboard();
      }
    }

    // 啟動直接顯示 Pathway 4 分類
    setModule('pathway');
  </script>
</body>
</html>
